name: Notificar participantes sobre Pull Request

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notificar participantes
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            // Obtém os colaboradores do repositório
            const collaborators = await github.paginate(
              github.rest.repos.listCollaborators,
              {
                owner,
                repo,
                affiliation: 'all'
              }
            );

            // Não menciona o autor do PR
            const author = context.payload.pull_request.user.login;

            const participants = collaborators
              .map(user => user.login)
              .filter(login => login !== author);

            if (participants.length === 0) {
              console.log('Nenhum participante para notificar.');
              return;
            }

            const mentions = participants
              .map(login => `@${login}`)
              .join(' ');

            const message = [
              '📢 **Novo Pull Request!**',
              '',
              `Foi aberto um novo Pull Request por @${author}:`,
              '',
              `🔗 ${context.payload.pull_request.html_url}`,
              '',
              mentions
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: message
            });
